<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lozano's Entertainment Ledger</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0a0f2c;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00d4ff;
      font-size: 2em;
    }

    .balance {
      text-align: center;
      font-size: 1.5em;
      margin-bottom: 30px;
      color: #00ffcc;
    }

    form {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    input[type="text"],
    input[type="number"] {
      padding: 10px;
      font-size: 1em;
      width: 200px;
      border: none;
      border-radius: 5px;
    }

    input[type="submit"] {
      padding: 10px 20px;
      font-size: 1em;
      background-color: #00d4ff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #444;
      text-align: center;
    }

    th {
      color: #00d4ff;
    }

    a {
      color: #ff4d4d;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <h1>Lozano's Entertainment Ledger</h1>

  <div class="balance">
    Remaining Balance: ${{ '%.2f' % total }}
  </div>

  <form method="POST" action="/add">
    <input type="text" name="description" placeholder="Description" required>
    <input type="number" name="amount" step="0.01" placeholder="Amount" required>
    <input type="submit" value="Add">
  </form>

  <table>
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Amount</th>
      <th>Action</th>
    </tr>
    {% for t in transactions %}
    <tr>
      <td>{{ t.date.strftime('%Y-%m-%d %H:%M') }}</td>
      <td>{{ t.description }}</td>
      <td>${{ '%.2f' % t.amount }}</td>
      <td><a href="/delete/{{ t.id }}">Delete</a></td>
    </tr>
    {% endfor %}
  </table>

</body>
</html>
