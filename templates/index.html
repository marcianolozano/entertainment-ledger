<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lozano's Entertainment Ledger</title>
    <style>
        body {
            background-color: #0a0f2c;
            color: #e0e6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background-color: #1a1f3c;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
        }

        h1, h2 {
            text-align: center;
            color: #66ccff;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }

        input {
            background-color: #e0e6f8;
            color: #0a0f2c;
        }

        button {
            background-color: #66ccff;
            color: #0a0f2c;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #33bbff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #121633;
            color: #e0e6f8;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444c77;
        }

        a {
            color: #ff6666;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .balance {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #00ffcc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lozano's Entertainment Ledger</h1>
        <div class="balance">Available Balance: ${{ "%.2f"|format(total) }}</div>

        <form action="/add" method="POST">
            <input type="text" name="description" placeholder="Description" required>
            <input type="number" step="0.01" name="amount" placeholder="Amount" required>
            <button type="submit">Add Transaction</button>
        </form>

        <table>
            <tr>
                <th>Description</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
            {% for transaction in transactions %}
            <tr>
                <td>{{ transaction.description }}</td>
                <td>${{ "%.2f"|format(transaction.amount) }}</td>
                <td>{{ transaction.date.strftime('%Y-%m-%d') }}</td>
                <td><a href="/delete/{{ transaction.id }}">Delete</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
