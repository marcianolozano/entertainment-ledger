
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lozano's Entertainment Ledger</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0f2c;
            color: #d2d8f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background-color: #111836;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #000;
        }
        h1 {
            color: #7ea9ff;
            font-weight: 500;
            text-align: center;
        }
        .balance {
            font-size: 1.5em;
            color: #8ab4f8;
            text-align: center;
            margin: 20px 0;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, button {
            padding: 10px;
            border-radius: 5px;
            border: none;
        }
        input {
            background-color: #1a233a;
            color: #fff;
        }
        button {
            background-color: #3171f5;
            color: white;
            cursor: pointer;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        tr:nth-child(even) {
            background-color: #1f2b4c;
        }
        .delete-btn {
            background-color: #ff4e4e;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lozano's Entertainment Ledger</h1>
        <div class="balance">Remaining Balance: ${{ balance }}</div>
        <form method="POST">
            <input type="text" name="description" placeholder="Description" required>
            <input type="number" step="0.01" name="amount" placeholder="Amount" required>
            <button type="submit">Add</button>
        </form>
        <table>
            <thead>
                <tr><th>Date</th><th>Description</th><th>Amount</th><th></th></tr>
            </thead>
            <tbody>
                {% for t in transactions %}
                <tr>
                    <td>{{ t.date.strftime('%Y-%m-%d') }}</td>
                    <td>{{ t.description }}</td>
                    <td>${{ '%.2f'|format(t.amount) }}</td>
                    <td><a class="delete-btn" href="{{ url_for('delete', id=t.id) }}">Delete</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
